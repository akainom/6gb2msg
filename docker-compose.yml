services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - /6gb2msg/mongo:/data/db
      - ./mongoInit.js:/docker-entrypoint-initdb.d/mongoInit.js:ro
    networks:
      - backend

  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3-amd64
    container_name: search
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=elastic
    volumes:
      - /6gb2msg/search:/usr/share/elasticsearch/data
    networks:
      - backend
    healthcheck:
      test: curl -sf -u elastic:elastic http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    volumes:
      - uploads:/uploads
    networks:
      - backend
    depends_on:
      - mongodb
      - search

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "27017:27017"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/uploads:ro
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - backend
    depends_on:
      - api

networks:
  backend:
    driver: bridge

volumes:
  uploads:
    driver: local
